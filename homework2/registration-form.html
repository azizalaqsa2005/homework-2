<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>User Registration</h1>

    <form action="/register" method="POST" enctype="multipart/form-data">

        <!-- ======================================= -->
        <!-- TODO 1: PERSONAL INFORMATION FIELDSET -->
        <!-- ======================================= -->
        <fieldset>
            <legend>Personal Information</legend>
            
            <!-- Full Name -->
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required minlength="3"><br><br>

            <!-- Email -->
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <!-- Password -->
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required minlength="8"><br><br>

            <!-- Confirm Password -->
            <label for="confirm-password">Confirm Password:</label><br>
            <input type="password" id="confirm-password" name="confirm-password" required minlength="8"><br><br>

            <!-- Date of Birth -->
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required>
        </fieldset>

        <br>

    </form>
</body>
</html>
<!-- ======================================= -->
        <!-- TODO 2: CONTACT INFORMATION FIELDSET -->
        <!-- ======================================= -->
        <fieldset>
            <legend>Contact Information</legend>

            <!-- Phone -->
            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Format: 059-123-4567"><br><br>

            <!-- Address -->
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="3" cols="40"></textarea><br><br>

            <!-- City Dropdown -->
            <label for="city">City:</label><br>
            <select id="city" name="city">
                <option value="">-- Select City --</option>
                <option value="Gaza">Gaza</option>
                <option value="Khan Younis">Khan Younis</option>
                <option value="Rafah">Rafah</option>
                <option value="Deir al-Balah">Deir al-Balah</option>
                <option value="Jabalia">Jabalia</option>
            </select>
        </fieldset>

        <br>
        <!-- ======================================= -->
        <!-- TODO 3: PREFERENCES FIELDSET -->
        <!-- ======================================= -->
        <fieldset>
            <legend>Preferences</legend>

            <!-- Gender (Radio Buttons) -->
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>

            <!-- Interests (Checkboxes) -->
            <label>Interests:</label><br>
            <input type="checkbox" id="interest-coding" name="interests" value="Coding">
            <label for="interest-coding">Coding</label><br>

            <input type="checkbox" id="interest-design" name="interests" value="Design">
            <label for="interest-design">Design</label><br>

            <input type="checkbox" id="interest-gaming" name="interests" value="Gaming">
            <label for="interest-gaming">Gaming</label><br>

            <input type="checkbox" id="interest-reading" name="interests" value="Reading">
            <label for="interest-reading">Reading</label><br>

            <input type="checkbox" id="interest-sports" name="interests" value="Sports">
            <label for="interest-sports">Sports</label><br><br>

            <!-- Skill Level (Range Slider) -->
            <label for="skill">Skill Level (1-10):</label><br>
            <input type="range" id="skill" name="skill" min="1" max="10" value="5">
        </fieldset>

        <br>
        <!-- ======================================= -->
        <!-- TODO 4: PROFILE PICTURE -->
        <!-- ======================================= -->
        <fieldset>
            <legend>Profile Picture</legend>

            <!-- File Upload for Image Only -->
            <label for="photo">Profile Picture:</label><br>
            <input type="file" id="photo" name="photo" accept="image/*">
        </fieldset>

        <br>
        <!-- ======================================= -->
        <!-- TODO 5: TERMS AND BUTTONS -->
        <!-- ======================================= -->
        <fieldset>
            <legend>Terms and Actions</legend>

            <!-- Terms Checkbox (Required) -->
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the Terms and Conditions</label><br><br>

            <!-- Submit and Reset Buttons -->
            <button type="submit">Register</button>
            <button type="reset">Clear Form</button>
        </fieldset>

    </form>

</body>
</html>
